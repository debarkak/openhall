version: '3.8'

services:
  openhall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openhall-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=file:/app/prisma/openhall.db
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - openhall_data:/app/prisma
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openhall_data:
    driver: local
